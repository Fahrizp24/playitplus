services:
  - type: web
    name: playitplus-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: CORS_ORIGIN
        sync: false
      - key: LLM_PROVIDER
        value: unified
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: STT_PROVIDER
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: STT_BASE_URL
        sync: false
      - key: STT_MODEL
        sync: false
      - key: HF_SPACE_URL
        sync: false
      - key: HF_TOKEN
        sync: false
